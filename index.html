<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>The family trail</title>
<style>
  :root { --night: #0a1034; --panel: #111a4a; --line: #2a3a86; --gold: #ffd76a; --mint: #9fe6b0; --ice: #c9d8ff; --dim: #8fa3d6; --red: #e8454c; --snow: #f4f8ff; }
  * { box-sizing: border-box; }
  html { background: var(--night); }
  body { margin: 0; min-height: 100vh; color: var(--snow); background: linear-gradient(#070b26, #0e1746 55%, #1a2460); font: 15px/1.45 "Courier New", ui-monospace, Menlo, monospace; text-transform: uppercase; letter-spacing: 0.04em; }
  main { max-width: 1060px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { margin: 6px 0 2px; font-size: clamp(24px, 5vw, 44px); letter-spacing: 0.08em; text-align: center; color: #fff; text-shadow: 3px 3px 0 #8a1f2c; }
  h2 { margin: 34px 0 10px; font-size: 18px; color: var(--gold); letter-spacing: 0.12em; }
  .sub { text-align: center; color: var(--ice); }
  .lights { height: 10px; margin: 8px auto 4px; max-width: 520px; background: radial-gradient(circle, #ff5c8a 2.5px, transparent 3px) 0 0 / 40px 10px, radial-gradient(circle, #ffd76a 2.5px, transparent 3px) 10px 0 / 40px 10px, radial-gradient(circle, #5cd6ff 2.5px, transparent 3px) 20px 0 / 40px 10px, radial-gradient(circle, #7dff3f 2.5px, transparent 3px) 30px 0 / 40px 10px; }
  .panel { background: rgba(8, 14, 46, 0.9); border: 2px solid var(--line); border-radius: 4px; padding: 14px 16px; }
  .goal { margin-top: 16px; text-align: center; border-color: var(--gold); }
  .goal b { display: block; font-size: clamp(20px, 4.4vw, 34px); letter-spacing: 0.08em; color: var(--gold); }
  .goal small { display: block; margin-top: 6px; color: var(--dim); font-size: 12px; }
  .bar { height: 12px; background: rgba(160, 190, 255, 0.2); border: 1px solid var(--line); }
  .bar i { display: block; height: 100%; background: var(--mint); }
  .big { font-size: 26px; color: var(--mint); }
  .gold { color: var(--gold); } .dim { color: var(--dim); } .mint { color: var(--mint); } .warn { color: #ffb347; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(310px, 1fr)); gap: 14px; }
  .me { display: flex; gap: 12px; align-items: flex-end; }
  .me > div { flex: 1; min-width: 0; }
  .pic { height: 150px; width: auto; image-rendering: pixelated; flex: none; margin: -8px -6px 0 -10px; }
  .who { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .who b { font-size: 22px; letter-spacing: 0.1em; }
  .flag { display: inline-block; width: 16px; height: 16px; border: 2px solid #fff; vertical-align: -2px; }
  .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--dim); color: var(--dim); }
  .home { margin-top: 6px; font-size: 13px; color: var(--ice); }
  .days { display: flex; flex-wrap: wrap; gap: 3px; margin: 10px 0 6px; }
  .days span { width: 14px; height: 14px; background: rgba(160, 190, 255, 0.13); border: 1px solid rgba(160, 190, 255, 0.22); }
  .days .some { background: #5a78c8; } .days .done { background: var(--gold); border-color: #fff6c8; } .days .today { outline: 2px solid #fff; }
  .days .later { opacity: 0.45; }
  .badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 8px; margin: 10px 0 4px; }
  .badge { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 3px; min-height: 96px; padding: 6px 4px; font: inherit; font-size: 10px; line-height: 1.2; letter-spacing: 0.03em; text-transform: uppercase; text-align: center; color: var(--snow); background: #16205a; border: 2px solid var(--line); border-radius: 6px; cursor: pointer; }
  .badge:hover, .badge:focus-visible { border-color: var(--gold); outline: none; }
  .badge img { height: 44px; width: auto; max-width: 70px; image-rendering: pixelated; animation: hop 1.1s steps(4) infinite; }
  .badge:nth-child(3n) img { animation-name: wob; animation-duration: 1.4s; } .badge:nth-child(3n+1) img { animation-delay: -0.4s; }
  .badge .star { font-size: 30px; line-height: 44px; color: var(--gold); animation: hop 1.1s steps(4) infinite; }
  .badge em { font-style: normal; color: var(--gold); }
  @keyframes hop { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
  @keyframes wob { 0%, 100% { transform: rotate(-7deg); } 50% { transform: rotate(7deg); } }
  @media (prefers-reduced-motion: reduce) { .badge img, .badge .star { animation: none; } }
  .hint { font-size: 11px; color: var(--dim); }
  details { margin-top: 8px; } summary { cursor: pointer; color: var(--dim); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; margin-top: 8px; }
  td { padding: 2px 0; vertical-align: top; } td:last-child { text-align: right; color: var(--mint); white-space: nowrap; }
  .list { margin: 8px 0 0; padding: 0; list-style: none; color: var(--ice); font-size: 13px; }
  .list li::before { content: "★ "; color: var(--gold); }
  svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 10px; font-size: 13px; }
  .btn { display: inline-block; padding: 9px 18px; font: inherit; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; color: #0a1034; background: var(--gold); border: 0; border-radius: 4px; cursor: pointer; }
  .btn.quiet { color: var(--snow); background: #24317a; }
  #pop { position: fixed; inset: 0; z-index: 9; display: flex; align-items: center; justify-content: center; padding: 14px; background: rgba(4, 7, 26, 0.86); }
  #pop[hidden] { display: none; }
  #pop .panel { width: min(360px, 100%); max-height: 96vh; overflow: auto; text-align: center; border-color: var(--gold); }
  #pop img.gif { width: 240px; height: 240px; max-width: 100%; image-rendering: pixelated; border: 2px solid var(--line); background: #101a4e; }
  #pop .row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 12px; }
  #pop .thing { display: flex; gap: 12px; align-items: center; text-align: left; margin-top: 12px; } #pop .thing img { width: 64px; image-rendering: pixelated; flex: none; }
  #gate { max-width: 420px; margin: 16vh auto 0; text-align: center; }
  #gate input { width: 100%; padding: 12px; margin: 14px 0 10px; font: inherit; font-size: 20px; text-align: center; letter-spacing: 0.15em; text-transform: none; color: #fff; background: #0a1034; border: 2px solid var(--gold); border-radius: 4px; }
  #no { min-height: 22px; color: #ff9a9a; margin-top: 12px; }
  footer { margin-top: 40px; text-align: center; color: var(--dim); font-size: 12px; }
  @media (max-width: 520px) { body { font-size: 14px; } .who b { font-size: 19px; } .pic { height: 112px; } }
</style>
</head>
<body>
<main>
  <section id="gate">
    <h1>The family trail</h1>
    <div class="lights"></div>
    <p class="sub">Family only. What is the password?</p>
    <form id="form">
      <input id="pw" type="password" autocomplete="current-password" autofocus aria-label="Password">
      <button class="btn">Open</button>
    </form>
    <div id="no"></div>
  </section>
  <section id="page" hidden></section>
</main>
<div id="pop" hidden><div class="panel" id="popin"></div></div>

async function unlock(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: bytes(SALT), iterations: ITER, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(IV) }, key, bytes(DATA));
  return JSON.parse(new TextDecoder().decode(plain));
}

// ------------------------------------------------------------------ the game's lettering (7 dots tall), for the GIFs
const glyph = (ch) => { const g = D.glyphs[ch]; return g ? g.split(' ') : null; };
function textWidth(text, scale) { let w = 0; for (const ch of String(text).toUpperCase()) { const g = glyph(ch); w += (g ? g[0].length : 3) + 1; } return Math.max(0, w - 1) * scale; }
function drawText(g, text, x, y, scale, colour, centre) {
  text = String(text).toUpperCase();
  if (centre) x = Math.round(x - textWidth(text, scale) / 2);
  g.fillStyle = colour;
  for (const ch of text) {
    const rows = glyph(ch);
    if (!rows) { x += 4 * scale; continue; }
    rows.forEach((row, j) => { for (let i = 0; i < row.length; i++) if (row[i] === '1') g.fillRect(x + i * scale, y + j * scale, scale, scale); });
    x += (rows[0].length + 1) * scale;
  }
}

// ------------------------------------------------------------------ a GIF, made here in the browser
/** GIF's own packing of a picture (LZW). `pixels`: a colour number for every dot. */
function pack(pixels, bitsMin) {
  const clear = 1 << bitsMin, end = clear + 1, out = [];
  let size = bitsMin + 1, next = end + 1, table = new Map(), hold = 0, held = 0;
  const put = (code) => { hold |= code << held; held += size; while (held >= 8) { out.push(hold & 255); hold >>>= 8; held -= 8; } };
  put(clear);
  let run = pixels[0];
  for (let i = 1; i < pixels.length; i++) {
    const k = pixels[i], key = (run << 8) | k, known = table.get(key);
    if (known !== undefined) { run = known; continue; }
    put(run);
    if (next < 4096) { table.set(key, next++); if (next > (1 << size) && size < 12) size++; }
    else { put(clear); table = new Map(); size = bitsMin + 1; next = end + 1; }
    run = k;
  }
  put(run);
  if (next === (1 << size) && size < 12) size++;       // (whoever reads this has just grown its codes: so must the last one)
  put(end);
  if (held > 0) out.push(hold & 255);
  return out;
}
/** frames: the same-sized pictures as RGBA; grow: how many times bigger to make each dot. Returns the GIF's bytes. */
function makeGif(frames, w, h, grow, hundredths) {
  // every colour used, as one list (a GIF has room for 256: coarsen until they fit)
  let shift = 0, colours;
  for (;;) {
    colours = new Map();
    const m = (0xff << shift) & 0xff;
    for (const f of frames) for (let i = 0; i < f.length && colours.size <= 256; i += 4) { const c = ((f[i] & m) << 16) | ((f[i + 1] & m) << 8) | (f[i + 2] & m); if (!colours.has(c)) colours.set(c, colours.size); }
    if (colours.size <= 256 || shift >= 4) break;
    shift++;
  }
  const m = (0xff << shift) & 0xff, W = w * grow, H = h * grow, out = [];
  const word = (n) => out.push(n & 255, (n >> 8) & 255);
  for (const ch of 'GIF89a') out.push(ch.charCodeAt(0));
  word(W); word(H); out.push(0xf7, 0, 0);
  const table = new Uint8Array(768);
  for (const [c, i] of colours) if (i < 256) { table[i * 3] = c >> 16; table[i * 3 + 1] = (c >> 8) & 255; table[i * 3 + 2] = c & 255; }
  for (const b of table) out.push(b);
  out.push(0x21, 0xff, 11); for (const ch of 'NETSCAPE2.0') out.push(ch.charCodeAt(0)); out.push(3, 1, 0, 0, 0);       // play it round and round
  for (const f of frames) {
    const dots = new Uint8Array(W * H);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, n = colours.get(((f[i] & m) << 16) | ((f[i + 1] & m) << 8) | (f[i + 2] & m)) || 0;
      for (let b = 0; b < grow; b++) for (let a = 0; a < grow; a++) dots[(y * grow + b) * W + x * grow + a] = n;
    }
    out.push(0x21, 0xf9, 4, 4); word(hundredths); out.push(0, 0);
    out.push(0x2c); word(0); word(0); word(W); word(H); out.push(0, 8);
    const packed = pack(dots, 8);
    for (let i = 0; i < packed.length; i += 255) { const n = Math.min(255, packed.length - i); out.push(n); for (let j = 0; j < n; j++) out.push(packed[i + j]); }
    out.push(0);
  }
  out.push(0x3b);
  return new Uint8Array(out);
}

const pictures = new Map();
const picture = (src) => { if (!src) return Promise.resolve(null); if (!pictures.has(src)) pictures.set(src, new Promise((ok) => { const im = new Image(); im.onload = () => ok(im); im.onerror = () => ok(null); im.src = src; })); return pictures.get(src); };
const artOf = (person, badge) => (badge.a === 'tent' ? person.tent : D.art[badge.a]) || '';

/** A badge as a little moving picture: the person, what they did, their name. 120 dots square, made twice that size. */
async function badgeGif(person, badge) {
  const L = 120, F = 12, ground = 88;
  const figs = (await Promise.all((person.frames || []).map(picture))).filter(Boolean), art = await picture(artOf(person, badge));
  const c = document.createElement('canvas'); c.width = L; c.height = L;
  const g = c.getContext('2d', { willReadFrequently: true }); g.imageSmoothingEnabled = false;
  const title = badge.t, ts = textWidth(title, 2) <= L - 8 ? 2 : 1, ns = textWidth(person.name, 2) <= L - 10 ? 2 : 1;
  const frames = [];
  for (let f = 0; f < F; f++) {
    const u = f / F, hop = Math.round(Math.abs(Math.sin(u * Math.PI * 2)) * 5);
    g.fillStyle = '#101a4e'; g.fillRect(0, 0, L, L);
    g.fillStyle = '#18266a'; g.fillRect(0, 70, L, ground - 70);
    for (let i = 0; i < 9; i++) { g.fillStyle = (i + f) % 4 ? '#8fa3d6' : '#ffffff'; g.fillRect((i * 41 + 7) % L, 30 + ((i * 23) % 36), 1, 1); }      // stars
    g.fillStyle = '#e9f0ff'; g.fillRect(0, ground, L, L - ground); g.fillStyle = '#c3d2f2'; g.fillRect(0, ground, L, 2);                          // snow
    drawText(g, title, L / 2 + 1, 6, ts, '#04081e', true); drawText(g, title, L / 2, 5, ts, '#ffd76a', true);
    const half = figs.length ? Math.round(person.fw / 2) : 0, px = art ? 28 : L / 2;
    if (figs.length) g.drawImage(figs[Math.floor(f / 3) % figs.length], Math.round(px - half), ground + 2 - person.foot - (f % 6 < 3 ? 0 : 1));
    if (art) {
      const k = Math.min(1, 46 / Math.max(art.width, art.height)), aw = Math.round(art.width * k), ah = Math.round(art.height * k), ax = (figs.length ? 84 : L / 2) - Math.round(aw / 2), ay = ground + 2 - ah - hop;
      g.drawImage(art, ax, ay, aw, ah);
      if (badge.n > 1) { const t = '×' + badge.n, cx = ax + Math.round(aw / 2); drawText(g, t, cx + 1, 25, 2, '#04081e', true); drawText(g, t, cx, 24, 2, '#ffffff', true); }
      for (const [sx, sy, ph] of [[-6, 4, 0], [aw + 3, 10, 4], [aw - 4, -5, 8], [2, -7, 6]]) if ((f + ph) % 12 < 5) { g.fillStyle = (f + ph) % 12 < 2 ? '#ffffff' : '#ffd76a'; g.fillRect(ax + sx - 1, ay + sy, 3, 1); g.fillRect(ax + sx, ay + sy - 1, 1, 3); }
    }
    for (let i = 0; i < 14; i++) { g.fillStyle = '#ffffff'; g.fillRect((i * 37 + 11 + (i % 3) * f) % L, (i * 53 + Math.round(u * L) * (1 + (i % 2))) % ground, 1 + (i % 5 === 0), 1 + (i % 5 === 0)); }   // snow, falling
    drawText(g, person.name, L / 2, ground + 5, ns, '#101a4e', true);       // (on the snow)
    drawText(g, D.event, L / 2, L - 9, 1, '#6b7fc0', true);
    frames.push(g.getImageData(0, 0, L, L).data);
  }
  return makeGif(frames, L, L, 2, 10);
}

// ------------------------------------------------------------------ the box that pops up (a badge to text, a door to look behind)
const pop = $('pop'), popin = $('popin');
let made = null;
function shut() { pop.hidden = true; popin.innerHTML = ''; if (made) URL.revokeObjectURL(made.url); made = null; }
pop.addEventListener('click', (e) => { if (e.target === pop) shut(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !pop.hidden) shut(); });

async function openBadge(person, badge) {
  popin.innerHTML = '<p class="gold">MAKING IT...</p>';
  pop.hidden = false;
  const data = await badgeGif(person, badge);
  const name = `${person.name}-${badge.t}`.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.gif';
  const file = new File([data], name, { type: 'image/gif' });
  if (made) URL.revokeObjectURL(made.url);
  made = { url: URL.createObjectURL(file), file, bytes: data };
  // TEXT IT opens the device's own share list. Only on a touch screen (a phone or a tablet): a computer's share
  // pop-up comes up empty for a picture made on the page and then sits there, stuck. On a computer there is SAVE IT.
  const touch = !!(window.matchMedia && matchMedia('(pointer: coarse)').matches);
  const canShare = touch && !!(navigator.canShare && navigator.canShare({ files: [file] }));
  popin.innerHTML = `<img class="gif" src="${made.url}" alt="${esc(person.name)}: ${esc(badge.t)}">
    <div class="row">${canShare ? '<button class="btn" id="send">Text it</button>' : ''}<a class="btn${canShare ? ' quiet' : ''}" download="${esc(name)}" href="${made.url}">Save it</a><button class="btn quiet" id="shut">Close</button></div>
    <p class="hint">${canShare ? 'TEXT IT OPENS YOUR PHONE\'S SHARE LIST: PICK MESSAGES.' : 'SAVE IT, THEN ADD IT TO A TEXT.'} OR PRESS AND HOLD THE PICTURE.</p>`;
  $('shut').onclick = shut;
  if (canShare) $('send').onclick = async () => { try { await navigator.share({ files: [file] }); } catch (e) { /* they changed their mind */ } };
  return data;
}
function openDoor(person) {
  const d = person.door;
  popin.innerHTML = `<p class="gold">DOOR ${d.n}: ${esc(person.name)}</p>` + d.items.map((i) => `<div class="thing">${i.icon ? `<img src="${i.icon}" alt="">` : ''}<div><b>${esc(i.name)}</b><br><span class="dim">${esc(i.blurb)}</span>${i.quip ? `<br><span class="gold">"${esc(i.quip)}"</span>` : ''}</div></div>`).join('') +
    `<p class="hint">YOU ARE HOME, SO THIS ONE OPENS WITHOUT GOING ANYWHERE. TAP IT ON THE PELOTON'S CALENDAR TOO, TO KEEP IT.</p><div class="row"><button class="btn quiet" id="shut">Close</button></div>`;
  pop.hidden = false;
  $('shut').onclick = shut;
}

// ------------------------------------------------------------------ the page
/** The trail: a winding line with a dot for every day, Thanksgiving on the left and home on the right, and everybody's flag where they are. */
function map(d) {
  const N = d.days, W = 1000, H = 300, x = (s) => 70 + (Math.min(Math.max(s, 0), N) / N) * 850, y = (s) => 170 + 46 * Math.sin(s * 0.62) + 14 * Math.sin(s * 1.7);
  let path = '';
  for (let s = 0; s <= N; s += 0.25) path += `${s ? 'L' : 'M'}${x(s).toFixed(1)},${y(s).toFixed(1)}`;
  let marks = '';
  for (let i = 0; i <= N; i++) {
    const today = d.started && i === d.day - 1, gone = d.started && i < d.day - 1;
    marks += `<circle cx="${x(i)}" cy="${y(i)}" r="${today ? 6 : i % 5 === 0 ? 4 : 3}" fill="${today ? '#ffd76a' : gone ? '#e8454c' : '#6f86c6'}" stroke="#0a1034" stroke-width="1.5"/>`;
  }
  let trees = '';
  for (let i = 0; i < 46; i++) { const tx = 30 + ((i * 197) % 940), ty = 40 + ((i * 89) % 230); if (Math.abs(ty - y(((tx - 70) / 850) * N)) < 34) continue; trees += `<path d="M${tx},${ty - 16} l9,16 h-5 l8,13 h-24 l8,-13 h-5 z" fill="#1c5a38" opacity="0.8"/><rect x="${tx - 2}" y="${ty + 13}" width="4" height="5" fill="#5a3a1e"/>`; }
  const everyone = d.people.map((p) => ({ name: p.name, color: p.color, at: p.at, note: p.yeti ? ' (THE YETI HAS THEM)' : '' })).concat(d.dogs.map((g) => ({ name: g.name, color: g.color, at: g.at, dog: true, note: '' })));
  const seen = [];
  let flags = '';
  for (const who of everyone.slice().sort((a, b) => a.at - b.at)) {
    const fx = x(who.at), up = seen.filter((q) => Math.abs(q - fx) < 22).length;
    seen.push(fx);
    const fy = y(who.at) - 8 - up * 19;
    flags += `<g><title>${esc(who.name)}: MILE ${who.at}${who.note}</title><rect x="${fx - 1}" y="${fy - 22}" width="2" height="${22 + up * 19}" fill="#0a1034" opacity="0.8"/>` +
      (who.dog ? `<circle cx="${fx + 9}" cy="${fy - 15}" r="8" fill="${rgb(who.color)}" stroke="#fff" stroke-width="1.5"/>` : `<rect x="${fx + 1}" y="${fy - 23}" width="18" height="15" fill="${rgb(who.color)}" stroke="#fff" stroke-width="1.5"/>`) +
      `<text x="${fx + (who.dog ? 9 : 10)}" y="${fy - 11}" font-size="11" font-weight="bold" text-anchor="middle" fill="#fff" stroke="#0a1034" stroke-width="2.5" paint-order="stroke">${esc(who.name[0])}</text></g>`;
  }
  // the yeti's line: nobody's flag goes past it before Christmas Eve
  const line = d.started && !d.eve && d.people.some((p) => p.yeti) ? `<line x1="${x(d.cap)}" y1="${y(d.cap) - 30}" x2="${x(d.cap)}" y2="${y(d.cap) + 22}" stroke="#c9d8ff" stroke-width="2" stroke-dasharray="4 4"/>${d.art.yeti ? `<image href="${d.art.yeti}" x="${x(d.cap) - 20}" y="${y(d.cap) - 74}" width="40" height="44" style="image-rendering:pixelated"/>` : ''}<text x="${x(d.cap)}" y="${y(d.cap) + 38}" font-size="11" text-anchor="middle" fill="#c9d8ff">THE YETI</text>` : '';
  const hx = x(N) + 16, hy = y(N) - 6, got = d.house.got;
  const tree = got[0].on ? `<path d="M${hx - 34},${hy - 34} l11,20 h-6 l10,17 h-30 l10,-17 h-6 z" fill="#2f9a66"/><rect x="${hx - 36}" y="${hy + 3}" width="5" height="7" fill="#5a3a1e"/><circle cx="${hx - 34}" cy="${hy - 36}" r="3" fill="#ffd76a"/>` : '';
  const bulbs = got[1].on ? ['#ff5c8a', '#ffd76a', '#5cd6ff', '#7dff3f', '#ff9a3f'].map((c, i) => `<circle cx="${hx - 12 + i * 8}" cy="${hy - (i < 3 ? i * 5 : (4 - i) * 5) - 3}" r="2.6" fill="${c}"/>`).join('') : '';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="The trail">
    <rect width="${W}" height="${H}" fill="#101a4e"/>${trees}
    <path d="${path}" fill="none" stroke="#0a1034" stroke-width="20" stroke-linecap="round" opacity="0.5"/>
    <path d="${path}" fill="none" stroke="#e9f0ff" stroke-width="13" stroke-linecap="round"/>
    <path d="${path}" fill="none" stroke="#bccdf2" stroke-width="2" stroke-dasharray="2 9"/>
    ${marks}${line}
    <text x="${x(0)}" y="${y(0) + 34}" font-size="13" text-anchor="middle" fill="#c9d8ff">THANKSGIVING</text>
    ${tree}<path d="M${hx - 16},${hy} l20,-17 l20,17 z" fill="#c2414d"/><rect x="${hx - 11}" y="${hy}" width="30" height="20" fill="#8a5a2e"/><rect x="${hx + 1}" y="${hy + 7}" width="8" height="13" fill="#ffd76a"/>
    <path d="M${hx - 16},${hy} l20,-17 l20,17" fill="none" stroke="#fff" stroke-width="3"/>${bulbs}
    <text x="${hx + 4}" y="${hy + 38}" font-size="13" text-anchor="middle" fill="#ffd76a">HOME</text>
    ${flags}
  </svg>`;
}

function show(d) {
  D = d;
  const pct = (a, b) => Math.max(0, Math.min(100, b ? (a / b) * 100 : 0));
  const when = new Date(d.made);
  const person = (p, pi) => {
    const ahead = p.miles - p.goal;
    const state = !d.started ? '' : ahead >= -0.02 ? `<span class="gold">ON THE TRAIL ★</span>` : `<span class="dim">${(-ahead).toFixed(1)} MI TO CATCH UP</span>`;
    const days = p.days.map((m, i) => `<span class="${m >= 0.98 ? 'done' : m > 0 ? 'some' : ''}${d.started && i === d.day - 1 ? ' today' : ''}${i > d.day - 1 ? ' later' : ''}" title="DAY ${i + 1}: ${m} MI"></span>`).join('');
    const rows = [['RIDES AND WALKS', p.rides], ['MINUTES MOVING', p.min], p.bike ? ['ON THE BIKE', `${p.bike} MI`] : null, p.tread ? ['ON THE TREADMILL', `${p.tread} MI`] : null, ['DAYS WITH THE MILE DONE', p.daysDone], ['DOORS OPENED', p.doors], ['CHRISTMAS CHEER', p.cheer.toLocaleString()], p.climbFt ? ['CLIMBED', `${p.climbFt.toLocaleString()} FT`] : null]
      .filter(Boolean).concat(p.did).concat(p.treats.map(([k, n]) => [`ATE: ${k}`, n]));
    const home = p.home ? `<div class="home gold">HOME FOR CHRISTMAS! ★${p.laps > 0 ? ` ${p.laps.toFixed(1)} LAPS ROUND THE HOUSE` : ''}</div>`
      : p.toGo === null ? '' : `<div class="home">HOME FOR CHRISTMAS MORNING:<br><span class="mint">${p.toGo.toFixed(1)} MI TO GO</span>${d.started ? ` • ${p.perDay.toFixed(1)} A DAY` : ''}</div>`;
    const yeti = p.yeti ? `<div class="home warn">THE YETI HAS YOU: ${p.bank.toFixed(1)} MI IN THE BANK</div>` : '';
    const badges = p.badges.map((b, bi) => { const src = artOf(p, b); return `<button class="badge" data-p="${pi}" data-b="${bi}" title="TAP TO TEXT IT">${src ? `<img src="${src}" alt="">` : '<span class="star">★</span>'}<span>${esc(b.t)}</span>${b.n > 1 ? `<em>×${b.n}</em>` : ''}</button>`; }).join('');
    return `<div class="panel">
      <div class="me">${p.pic ? `<img class="pic" src="${p.pic}" alt="${esc(p.name)}">` : ''}<div>
        <div class="who">${p.pic ? '' : `<span class="flag" style="background:${rgb(p.color)}"></span>`}<b>${esc(p.name)}</b>${p.visiting ? `<span class="tag">${p.visiting}</span>` : ''}</div>
        <div><span class="big">${p.miles.toFixed(1)}</span> OF ${p.goal} MI</div>
        <div class="home">${state}</div>
        <div class="bar"><i style="width:${pct(p.miles, Math.max(p.goal, 1))}%"></i></div>

    <div class="panel goal"><b>Be home for Christmas morning</b>${d.sleeps > 0 ? `${d.sleeps} ${d.sleeps === 1 ? 'SLEEP' : 'SLEEPS'} TO GO` : 'IT IS CHRISTMAS!'}</div>
    <div class="panel" style="margin-top:14px;border-color:#9fe6b0;text-align:center">
      <b style="display:block;font-size:20px;letter-spacing:0.1em;color:#9fe6b0">This is not a competition</b>

    </div>
    <div class="panel" style="margin-top:14px">
      <div><span class="big">${d.total.toFixed(1)}</span> OF ${d.goal} MILES TOGETHER &nbsp; <span class="dim">${d.rides} OUTINGS, ${d.minutes.toLocaleString()} MINUTES</span></div>

      <div class="legend">${d.people.map((p) => `<span><span class="flag" style="background:${rgb(p.color)}"></span> ${esc(p.name)} ${p.at.toFixed(1)}${p.yeti ? ' <span class="warn">(YETI)</span>' : ''}</span>`).join('')}${d.dogs.map((g) => `<span><span class="flag" style="background:${rgb(g.color)};border-radius:50%"></span> ${esc(g.name)} ${g.at.toFixed(1)}</span>`).join('')}</div>
    </div>
    <h2>Everybody</h2>
    <p class="dim" style="margin:-4px 0 10px">IN NO ORDER. EVERYBODY'S BEST IS THEIR OWN: A SLOW MILE COUNTS THE SAME AS A FAST ONE.</p>
    <div class="grid">${d.people.map(person).join('')}</div>
    ${d.dogs.length ? `<h2>The dogs</h2><div class="grid">${d.dogs.map((g) => `<div class="panel"><div class="me">${g.pic ? `<img class="pic" style="height:84px" src="${g.pic}" alt="">` : ''}<div><div class="who">${g.pic ? '' : `<span class="flag" style="background:${rgb(g.color)};border-radius:50%"></span>`}<b>${esc(g.name)}</b></div><table><tr><td>MILES RUN</td><td>${g.miles.toFixed(1)}</td></tr><tr><td>OUTINGS</td><td>${g.outings}</td></tr><tr><td>POOP BREAKS</td><td>${g.poops}</td></tr></table></div></div></div>`).join('')}</div>` : ''}
    ${d.people.some((p) => p.home) ? `<h2>The house</h2>
    <div class="panel"><div>ONCE YOU ARE HOME, EVERY EXTRA MILE IS A LAP ROUND THE HOUSE. <span class="mint">${d.house.laps.toFixed(1)} ${d.house.laps === 1 ? 'LAP' : 'LAPS'} SO FAR</span></div><table>${house}</table></div>` : ''}
    ${d.family.length || d.records.length ? `<h2>What we have all done</h2><div class="panel"><table>${d.records.concat(d.family).map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(typeof v === 'number' ? v.toLocaleString() : v)}</td></tr>`).join('')}</table></div>` : ''}
    <footer>FROM THE RIDES THE ${esc(d.machines.join(' AND ').toUpperCase())} ${d.machines.length > 1 ? 'HAVE' : 'HAS'} SENT IN • MADE ${when.toLocaleString()}<br>THINGS KNOCKED OVER ARE COUNTED EXACTLY FROM 27 NOVEMBER; BEFORE THAT, ONCE A RIDE</footer>`;
  $('page').addEventListener('click', (e) => {
    const b = e.target.closest('.badge'), door = e.target.closest('[data-door]');
    if (b) openBadge(d.people[Number(b.dataset.p)], d.people[Number(b.dataset.p)].badges[Number(b.dataset.b)]);
    else if (door) openDoor(d.people[Number(door.dataset.door)]);
  });
  $('gate').hidden = true;
  $('page').hidden = false;
  tryOut();
}

/** (Trying things out, with a copy that is not locked.) #gif=2,0 makes the first badge of the third person and writes it into the page; #door=0 opens a door. */
async function tryOut() {
  const gif = /#gif=(\d+),(\d+)/.exec(location.hash), door = /#door=(\d+)/.exec(location.hash);
  if (door && D.people[Number(door[1])] && D.people[Number(door[1])].door) openDoor(D.people[Number(door[1])]);
  if (!gif) return;
  const p = D.people[Number(gif[1])], b = p && p.badges[Number(gif[2])];
  const pre = document.createElement('pre'); pre.id = 'gifout'; pre.hidden = true; document.body.appendChild(pre);
  if (!b) { pre.textContent = 'NOGIF'; return; }
  const data = await openBadge(p, b);
  let s = ''; for (const v of data) s += String.fromCharCode(v);
  pre.textContent = 'GIFSTART' + btoa(s) + 'GIFEND';
}

const no = $('no');
async function tryIt(password, quiet) {
  if (!window.crypto || !crypto.subtle) { no.textContent = 'THIS BROWSER CANNOT UNLOCK THE PAGE HERE. OPEN IT OVER HTTPS, OR ON THE COMPUTER IT WAS MADE ON.'; return; }
  let d;
  try { d = await unlock(password); } catch (e) { if (!quiet) no.textContent = 'NOT THAT ONE. TRY AGAIN.'; return; }
  try { sessionStorage.setItem('trail', password); } catch (e) { /* private window */ }
  show(d);
}
$('form').addEventListener('submit', (e) => { e.preventDefault(); no.textContent = 'ONE MOMENT...'; tryIt($('pw').value.trim()); });
if (OPEN) show(OPEN);
else { try { const kept = sessionStorage.getItem('trail'); if (kept) tryIt(kept, true); } catch (e) { /* no storage */ } }
</script>
